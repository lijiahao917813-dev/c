<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C 在线编译 · 考前速通</title><link rel="stylesheet" href="style.css"></head>
<body><div class="workspace"><header class="top"><a id="backToStudy" class="back" href="../">← 返回复习</a><span class="brand">C_ <b>在线编译</b></span><span class="tag">C11</span></header>
<section class="intro"><div><p class="eyebrow">WRITE · RUN · UNDERSTAND</p><h1>把想法跑一遍。</h1><p>写代码，填好输入，点运行。代码和输入会自动保存在当前浏览器。</p></div><span class="privacy">本机编译运行 · 无需登录</span></section>
<div class="toolbar"><label class="examples">试试示例 <select id="example" aria-label="选择代码示例"><option value="blank">基础模板</option><option value="hello">Hello C</option><option value="input">输入两个数</option><option value="array">数组与指针</option><option value="recursion">递归阶乘</option><option value="memory">结构体与动态内存</option></select></label><div class="tool-buttons"><button id="download" class="secondary">下载 .c</button><button id="stop" class="secondary" disabled>停止</button><button id="run" class="primary">▶ 运行代码</button></div></div>
<main class="panels"><section class="panel editor-panel"><div class="panel-head"><b>main.c</b><div class="editor-tools"><span id="saveStatus">自动保存</span><button id="resetSource" class="reset-source" title="清空代码并恢复 C 语言基础模板">↺ 一键清空</button></div></div><label class="sr-only" for="source">C 源代码</label><textarea id="source" class="source" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" aria-describedby="editorHint"></textarea><p id="editorHint" class="editor-hint">Tab 缩进 · Ctrl / ⌘ + Enter 运行</p></section>
<div class="side-panels"><section class="panel"><div class="panel-head"><label for="stdin"><b>程序输入</b></label><span>stdin</span></div><textarea id="stdin" class="stdin" spellcheck="false" placeholder="有 scanf / getchar 时，先把输入写在这里。\n例如：3 5"></textarea></section>
<section class="panel output-panel"><div class="panel-head"><b>运行结果</b><button id="clear" class="text-button">清空</button></div><div id="status" class="status" role="status" aria-live="polite">准备就绪</div><pre id="stdout" class="output" aria-label="程序输出">点击“运行代码”查看结果。</pre><details id="diagnostics"><summary>编译信息与报错</summary><pre id="stderr" class="diagnostics"></pre></details></section></div></main>
<footer><p id="loadingHint">首次运行需下载约 18 MB 编译环境；仅此工具加载，之后优先使用浏览器缓存。运行时限 3 秒，可随时停止。</p><p>使用标准 C 头文件；暂不支持 conio.h、Windows 专用接口和交互式终端。先填输入，再运行。<a href="vendor/SOURCE.txt" target="_blank" rel="noopener">开源组件</a></p></footer></div><script src="app.js"></script></body></html>
