<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C 算法练习</title><style>
*{box-sizing:border-box}body{background:#f4f6ef;color:#20392d;font:16px/1.65 system-ui;margin:0}main{max-width:850px;margin:auto;padding:24px 16px}section{background:white;padding:clamp(16px,4vw,32px);border:1px solid #dde5d8;border-radius:18px;margin:16px 0}a{color:#316749}select,button{font:inherit;border-radius:10px;padding:9px 14px;border:1px solid #cedbce;background:white}button{cursor:pointer}button:disabled{opacity:.55}#submit{background:#28694e;color:white}textarea,pre{font:15px/1.65 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%;height:310px;background:#202622;color:#eef5ef;padding:16px;border-radius:12px;tab-size:4}pre{background:#eef3eb;padding:12px;border-radius:8px}h1,h2,p{margin:8px 0}label{display:block;font-weight:650;margin-bottom:5px}select{max-width:100%}</style><main><a href="./">← 复习首页</a><h1>算法练习</h1><label for="task">选择题目</label><select id="task"></select><section><h2 id="title"></h2><p id="statement"></p><b>样例输入</b><pre id="input"></pre><b>样例输出</b><pre id="expected"></pre></section><section><label for="source">你的 C 程序</label><textarea id="source" spellcheck="false"></textarea><div><button id="sample">运行样例</button> <button id="submit">提交判题</button> <button id="stop" hidden>停止</button></div><pre id="result" role="status">等待运行</pre></section></main><script>
const tasks=[
['sum','区间奇数和','输入两个整数 a、b（0 ≤ a ≤ b ≤ 1000），输出闭区间内所有奇数的和。',[['2 7','15'],['0 0','0'],['5 5','5'],['0 1000','250000']]],
['digits','数位之和','输入一个 0 到 1000000000 的整数，输出它的各位数字之和。',[['4072','13'],['0','0'],['999999999','81'],['1000000000','1']]],
['peak','第一次最高分','输入人数 n（1 到 100），随后输入 n 个整数成绩（0 到 100）。输出最高分及第一次取得该分数的学生序号，序号从 1 开始，用空格分隔。',[['5\n80 95 67 95 70','95 2'],['1\n0','0 1'],['4\n1 2 3 4','4 4'],['3\n70 70 70','70 1']]],
['gcd','最大公约数','输入两个 1 到 1000000 的正整数，输出它们的最大公约数。',[['24 18','6'],['13 7','1'],['8 8','8'],['15 60','15']]],
['pal','回文单词','输入一个长度为 1 到 100 的小写英文字母单词。如果从左到右和从右到左相同，输出 YES，否则输出 NO。',[['level','YES'],['a','YES'],['abca','NO'],['abba','YES'],['cat','NO']]],
['sort','成绩升序排列','输入 n（1 到 100），随后输入 n 个整数成绩（0 到 100）。按从小到大的顺序输出全部成绩，用空格分隔，保留重复成绩。',[['5\n75 100 60 75 0','0 60 75 75 100'],['1\n42','42'],['4\n4 3 2 1','1 2 3 4'],['3\n9 9 9','9 9 9']]]
];
const el=id=>document.getElementById(id), pick=el('task'),editor=el('source'),result=el('result');
const starter='#include <stdio.h>\n\nint main(void) {\n    \n    return 0;\n}\n';
let worker,timer;
function current(){return tasks[pick.selectedIndex]}
function labels(){tasks.forEach(([id,name],i)=>pick.options[i].textContent=(localStorage.getItem('oj.pass.'+id)?'✓ ':'')+name)}
tasks.forEach(()=>pick.add(new Option()));labels();
function load(){const [id,name,desc,cases]=current();el('title').textContent=name;el('statement').textContent=desc;el('input').textContent=cases[0][0];el('expected').textContent=cases[0][1];editor.value=localStorage.getItem('oj.code.'+id)??starter;result.textContent='等待运行';localStorage.setItem('oj.last',id)}
pick.selectedIndex=Math.max(0,tasks.findIndex(t=>t[0]===localStorage.getItem('oj.last')));load();pick.onchange=load;editor.oninput=()=>localStorage.setItem('oj.code.'+current()[0],editor.value);
function finish(message){clearTimeout(timer);worker?.terminate();worker=null;result.textContent=message;pick.disabled=editor.readOnly=el('sample').disabled=el('submit').disabled=false;el('stop').hidden=true}
function run(all){const [id,,,cases]=current(),count=all?cases.length:1;let index=0;pick.disabled=editor.readOnly=el('sample').disabled=el('submit').disabled=true;el('stop').hidden=false;
try{worker=new Worker('compiler/worker.js')}catch(e){finish('无法启动编译器：'+e.message);return}
function time(ms,msg){clearTimeout(timer);timer=setTimeout(()=>finish(msg),ms)}
function next(){result.textContent='正在准备测试 '+(index+1)+' / '+count;time(90000,'编译环境准备超时，请重试。');worker.postMessage({type:'run',source:editor.value,input:cases[index][0]+'\n'})}
worker.onerror=e=>finish('编译环境出错：'+e.message);
worker.onmessage=({data})=>{if(data.type==='status'&&data.stage==='run')time(3000,'运行超时，请检查循环和递归终止条件。');if(data.type!=='done')return;
if(!data.success){finish([data.stage==='compile'?'编译失败':'运行失败',data.stderr,data.message].filter(Boolean).join('\n'));return}
const [input,expected]=cases[index],normalize=s=>s.trim().split(/\s+/).join(' ');
if(normalize(data.stdout)!==normalize(expected)){finish('答案不一致 · 测试 '+(index+1)+'\n输入：'+input+'\n期望：'+expected+'\n实际：'+(data.stdout||'（无输出）'));return}
if(++index<count){next();return}
if(all){localStorage.setItem('oj.pass.'+id,'1');labels()}finish(all?'通过全部 '+count+' 组测试':'样例通过\n'+data.stdout)};next()}
el('sample').onclick=()=>run(false);el('submit').onclick=()=>run(true);el('stop').onclick=()=>finish('已停止');
</script></html>
